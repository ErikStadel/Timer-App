<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#09090b" />
    <title>Timer Editor</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <script src="../js/dataStorage.js"></script>
    <script src="../js/ui-config.js"></script>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #09090b;
            font-family: 'Inter', sans-serif;
            color: #fafafa;
            overscroll-behavior: none;
            scroll-padding-top: 4rem;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 1rem;
            background-color: rgba(9, 9, 11, 0.85); /* Zinc 950 */
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #27272a; /* Zinc 800 */
        }

        header::before {
            content: "";
            position: absolute;
            top: -100vh;
            left: 0;
            right: 0;
            height: 100vh;
            background-color: #09090b;
            z-index: -1;
        }

        .editor-content {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .interval-list {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .interval-item {
            position: relative;
            overflow: hidden;
            background-color: #18181b; /* Zinc 900 */
            border: 1px solid #27272a; /* Zinc 800 */
            border-radius: 1rem;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s;
        }

        .interval-item:active {
            transform: scale(0.97);
            border-color: #3f3f46;
        }

        .interval-item>div:first-child {
            padding: 1.25rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: opacity 0.3s ease;
            user-select: none;
        }

        .interval-item.options-active>div:first-child {
            opacity: 0.4;
        }

        .interval-item>div.swipe-options-container {
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 100%;
            display: flex;
            align-items: stretch;
            background-color: transparent;
        }

        .interval-item>div.swipe-options-container.slide-in {
            transform: translateX(0%);
        }

        .interval-item>div.swipe-options-container.slide-out {
            transform: translateX(100%);
        }

        .interval-item>div.swipe-options-container span {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fafafa;
            cursor: pointer;
            padding: 0 1.25rem;
            font-weight: 600;
        }

        .edit-action {
            background-color: #27272a; /* Zinc 800 */
            flex-grow: 1;
        }
        
        .delete-action {
            background-color: #eb4639; /* Light Crimson */
            flex-grow: 1;
        }

        .interval-item.sortable-mode {
            touch-action: none !important;
        }

        .interval-item.sortable-mode:active {
            transform: none !important;
        }

        .sortable-chosen {
            cursor: grabbing !important;
        }

        .sortable-ghost {
            opacity: 0.2 !important;
            background-color: #27272a !important;
            border: 1px dashed #52525b !important;
            transform: none !important;
        }

        .sortable-fallback {
            opacity: 1 !important;
            background-color: #18181b !important;
            border: 1px solid #3f3f46 !important;
            border-radius: 1rem !important;
            box-shadow: 0 25px 35px -5px rgba(0, 0, 0, 0.8), 0 10px 15px -5px rgba(0, 0, 0, 0.6) !important;
            cursor: grabbing !important;
            pointer-events: none !important;
            z-index: 99999 !important;
            transition: none !important; /* CRITICAL: Must not transition transform while dragging! */
        }

        .sortable-fallback > div {
            transform: scale(1.03);
        }

        .sort-icon {
            color: #52525b; /* Zinc 500 */
            margin-right: 0.75rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
        }

        .interval-item.sortable-mode .sort-icon {
            opacity: 1;
        }

        .interval-details {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.25rem;
        }

        .interval-times {
            display: flex;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .time-badge {
            padding: 0.2rem 0.5rem;
            border-radius: 0.5rem;
        }
        
        .time-badge.work {
            background-color: rgba(249, 115, 22, 0.15); /* Vermillion tinted bg */
            color: #f97316;
        }
        
        .time-badge.rest {
            background-color: rgba(34, 197, 94, 0.15); /* Jade tinted bg */
            color: #22c55e;
        }

        input[type="text"], input[type="number"] {
            background-color: #18181b;
            border: 1px solid #27272a;
            color: #fafafa;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 1.125rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #f97316;
        }

        /* Confirmation Dialog */
        .confirmation-dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .confirmation-dialog-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .confirmation-dialog {
            background-color: #18181b;
            color: #fafafa;
            padding: 1.5rem;
            border-radius: 1.25rem;
            border: 1px solid #27272a;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 80%;
            min-width: 280px;
        }

        .confirmation-dialog p {
            font-size: 1.125rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .confirmation-dialog-buttons {
            display: flex;
            justify-content: space-around;
            gap: 1rem;
        }

        .btn-cancel, .btn-confirm {
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            flex-grow: 1;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-cancel:active, .btn-confirm:active {
            transform: scale(0.95);
        }

        .btn-cancel {
            background-color: #27272a;
            color: #fafafa;
        }

        .btn-confirm {
            background-color: #eb4639; /* Light Crimson */
            color: #ffffff;
        }
        
        /* Outline Buttons */
        .outline-button {
            background-color: transparent;
            border: 1px solid #f97316;
            color: #f97316;
            padding: 1rem;
            border-radius: 0.75rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .outline-button:active {
            transform: scale(0.97);
            background-color: rgba(249, 115, 22, 0.1);
        }
    </style>
</head>

<body class="text-textMain">
    <header id="header" class="text-textMain">
        <div class="w-full flex justify-between items-center">
            <button class="p-2 -ml-2 rounded-full active:bg-surfaceBorder transition-colors"
                onclick="triggerHapticFeedback(10); window.location.href='../home-screen/index.html';">
                <i data-lucide="chevron-left" class="w-6 h-6 text-primary"></i>
            </button>
            <h1 id="headerTitle" class="text-xl font-semibold tracking-wide">Add Timer</h1>
            <button id="saveButton" class="text-primary font-semibold tracking-wide p-2 -mr-2 rounded-full active:bg-surfaceBorder transition-colors">
                Save
            </button>
        </div>
    </header>

    <div class="editor-content pt-4">
        <div>
            <label class="block text-textMuted font-medium mb-2 pl-1">Timer Name</label>
            <input type="text" id="timerNameInput" placeholder="z.B. Boxrunde" />
        </div>

        <div class="mt-2">
            <label class="block text-textMuted font-medium mb-2 pl-1">Repeat</label>
            <input type="number" id="repeatInput" min="1" value="1" />
        </div>

        <div class="interval-list mt-2">
            <h2 class="text-textMuted font-medium pl-1 mb-1">Intervals</h2>
            <div id="intervalContainer" class="flex flex-col gap-3"></div>
        </div>

        <button id="addIntervalButton"
            class="outline-button mt-4" onclick="triggerHapticFeedback(10)">
            <i data-lucide="plus" class="w-5 h-5"></i>
            Add Interval
        </button>
    </div>

    <div class="confirmation-dialog-overlay" id="deleteConfirmationDialog">
        <div class="confirmation-dialog">
            <p>Delete Interval?</p>
            <div class="confirmation-dialog-buttons">
                <button class="btn-cancel" id="cancelDelete">Cancel</button>
                <button class="btn-confirm" id="confirmDelete">Delete</button>
            </div>
        </div>
    </div>

    <script>
        const header = document.getElementById('header');
        const headerTitle = document.getElementById('headerTitle');
        const saveButton = document.getElementById('saveButton');
        const intervalContainer = document.getElementById('intervalContainer');
        const addIntervalButton = document.getElementById('addIntervalButton');
        const timerNameInput = document.getElementById('timerNameInput');
        const repeatInput = document.getElementById('repeatInput');

        const deleteConfirmationDialog = document.getElementById('deleteConfirmationDialog');
        const cancelDeleteButton = document.getElementById('cancelDelete');
        const confirmDeleteButton = document.getElementById('confirmDelete');

        let activeOptionsItem = null;
        let sortableInstance = null;
        let longPressTimer = null;
        let longPressThreshold = 500;
        let isSortableMode = false;
        let touchStartX = 0;
        let touchStartY = 0;
        const swipeThreshold = 50;
        let currentListItem = null;

        let currentTimerId = null;
        let intervals = [];

        // --- Helper Functions for Data Management ---
        function formatTimeForEditor(interval) {
            const formatDuration = (seconds) => {
                const minutes = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };
            return `${formatDuration(interval.durationInterval)} | ${formatDuration(interval.durationRest)}`;
        }

        // --- Swipe Logic ---
        function handleSwipe(listItem, deltaX) {
            if (deltaX < -swipeThreshold) { // Swipe Left to show options
                showOptions(listItem);
            }
            else if (deltaX > swipeThreshold) { // Swipe Right to close options
                closeOptions(listItem);
            } else {
                if (listItem.classList.contains('options-active')) {
                    closeOptions(listItem);
                }
            }
        }

        function showOptions(listItem) {
            if (activeOptionsItem && activeOptionsItem !== listItem) {
                closeOptions(activeOptionsItem);
            }
            activeOptionsItem = listItem;

            let optionsElement = listItem.querySelector('.swipe-options-container');
            if (!optionsElement) {
                optionsElement = document.createElement('div');
                optionsElement.classList.add('swipe-options-container');
                optionsElement.innerHTML = `
                  <span class="edit-action clone-button"><i data-lucide="copy" class="w-5 h-5 mr-1"></i>Clone</span>
                  <span class="delete-action delete-button"><i data-lucide="trash-2" class="w-5 h-5 mr-1"></i>Delete</span>
              `;
                listItem.appendChild(optionsElement);
                lucide.createIcons({ root: optionsElement });

                const cloneButton = optionsElement.querySelector('.clone-button');
                const deleteButton = optionsElement.querySelector('.delete-button');

                cloneButton.addEventListener('click', (e) => {
                    triggerHapticFeedback(10);
                    e.stopPropagation();
                    const itemId = listItem.dataset.intervalId;
                    cloneInterval(itemId);
                    closeOptions(listItem);
                });

                deleteButton.addEventListener('click', (e) => {
                    triggerHapticFeedback(20);
                    e.stopPropagation();
                    const itemId = listItem.dataset.intervalId;
                    showDeleteConfirmation(itemId);
                });
            }

            setTimeout(() => {
                optionsElement.classList.add('slide-in');
                listItem.classList.add('options-active');
            }, 0);
        }

        function closeOptions(listItem) {
            const optionsElement = listItem.querySelector('.swipe-options-container');
            if (optionsElement) {
                optionsElement.classList.remove('slide-in');
                optionsElement.classList.add('slide-out');
                listItem.classList.remove('options-active');
                setTimeout(() => {
                    if (optionsElement && optionsElement.parentNode === listItem) {
                        optionsElement.remove();
                    }
                    activeOptionsItem = null;
                }, 300);
            }
        }

        function cloneInterval(itemId) {
            const indexToClone = intervals.findIndex(item => item.id === itemId);
            if (indexToClone !== -1) {
                const clonedInterval = { ...intervals[indexToClone], id: generateUniqueId() };
                intervals.splice(indexToClone + 1, 0, clonedInterval);
                let allTimers = loadTimers();
                const timerIndex = allTimers.findIndex(t => t.id === currentTimerId);
                if (timerIndex !== -1) {
                    allTimers[timerIndex].intervals = intervals;
                    saveTimers(allTimers);
                }
                renderIntervalList();
            }
        }

        // --- Confirmation Dialog and Delete Logic ---
        let intervalToDeleteId = null;

        function showDeleteConfirmation(intervalId) {
            intervalToDeleteId = intervalId;
            deleteConfirmationDialog.classList.add('active');
        }

        function hideDeleteConfirmation() {
            deleteConfirmationDialog.classList.remove('active');
            intervalToDeleteId = null;
            if (activeOptionsItem) {
                closeOptions(activeOptionsItem);
            }
        }

        cancelDeleteButton.addEventListener('click', hideDeleteConfirmation);
        confirmDeleteButton.addEventListener('click', () => {
            if (intervalToDeleteId) {
                deleteIntervalConfirmed(intervalToDeleteId);
                hideDeleteConfirmation();
            }
        });

        function deleteIntervalConfirmed(idToDelete) {
            intervals = intervals.filter(item => item.id !== idToDelete);
            let allTimers = loadTimers();
            const timerIndex = allTimers.findIndex(t => t.id === currentTimerId);
            if (timerIndex !== -1) {
                allTimers[timerIndex].intervals = intervals;
                saveTimers(allTimers);
            }
            renderIntervalList();
        }

        function formatTimeForEditor(interval) {
            const iDur = interval.durationInterval || 0;
            const rDur = interval.durationRest || 0;
            
            const formatSecs = (secs) => {
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                return m > 0 ? `${m}m ${s}s` : `${s}s`;
            };

            let html = '';
            if (iDur > 0) html += `<span class="time-badge work">Work: ${formatSecs(iDur)}</span>`;
            if (rDur > 0) html += `<span class="time-badge rest">Rest: ${formatSecs(rDur)}</span>`;
            
            return html || '<span class="time-badge">0s</span>';
        }

        // --- Render Interval List ---
        function renderIntervalList() {
            intervalContainer.innerHTML = '';
            if (intervals.length === 0) {
                const noIntervalsMessage = document.createElement('div');
                noIntervalsMessage.classList.add('text-center', 'text-textMuted', 'mt-4', 'p-4', 'rounded-xl', 'bg-surfaceBorder', 'font-medium');
                noIntervalsMessage.textContent = 'No intervals yet. Tap "Add Interval" to create one.';
                intervalContainer.appendChild(noIntervalsMessage);
                return;
            }

            intervals.forEach(interval => {
                const listItem = document.createElement('div');
                listItem.classList.add('interval-item');
                listItem.dataset.intervalId = interval.id;

                if (isSortableMode) {
                    listItem.classList.add('sortable-mode');
                }

                listItem.innerHTML = `
                  <div class="select-none">
                      <span class="sort-icon"><i data-lucide="grip-vertical"></i></span>
                      <span class="interval-name text-textMain font-semibold ml-2 overflow-hidden text-ellipsis whitespace-nowrap">${interval.name}</span>
                      <div class="interval-times ml-auto flex-shrink-0">${formatTimeForEditor(interval)}</div>
                  </div>
              `;

                listItem.querySelector('div:first-child').addEventListener('click', (e) => {
                    if (isSortableMode || activeOptionsItem === listItem) {
                        e.stopPropagation();
                        return;
                    }

                    const itemId = listItem.dataset.intervalId;
                    window.location.href = `../interval-editor/interval-editor.html?timerId=${currentTimerId}&intervalId=${itemId}`;
                });

                let startX = 0;
                let startY = 0;
                let isSwipingOrScrolling = false;
                let isLongPress = false;
                let longPressTimeout;
                let movementThreshold = 10;

                listItem.addEventListener('touchstart', (e) => {
                    if (!isSortableMode) {
                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                        isSwipingOrScrolling = false;
                        isLongPress = false;

                        if (activeOptionsItem && activeOptionsItem !== listItem) {
                            closeOptions(activeOptionsItem);
                        }

                        longPressTimeout = setTimeout(() => {
                            if (!isSwipingOrScrolling) {
                                e.preventDefault();
                                isLongPress = true;
                                triggerHapticFeedback(10);
                                enableSortableMode();
                            }
                        }, longPressThreshold);
                    }
                }, { passive: false });

                listItem.addEventListener('touchmove', (e) => {
                    if (!isSortableMode) {
                        const currentX = e.touches[0].clientX;
                        const currentY = e.touches[0].clientY;
                        const deltaX = currentX - touchStartX;
                        const deltaY = currentY - touchStartY;

                        if (Math.abs(deltaX) > movementThreshold || Math.abs(deltaY) > movementThreshold) {
                            isSwipingOrScrolling = true;
                            clearTimeout(longPressTimeout);

                            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                                e.preventDefault();
                                const optionsElement = listItem.querySelector('.swipe-options-container');
                                if (optionsElement) {
                                    const newTransformX = Math.max(0, Math.min(100, 100 + (deltaX / listItem.offsetWidth) * 100));
                                    optionsElement.style.transform = `translateX(${newTransformX}%)`;
                                }
                            }
                        }
                    }
                }, { passive: false });

                listItem.addEventListener('touchend', (e) => {
                    if (!isSortableMode) {
                        clearTimeout(longPressTimeout);
                        if (!isLongPress && isSwipingOrScrolling) {
                            const endX = e.changedTouches[0].clientX;
                            const deltaX = endX - touchStartX;

                            if (Math.abs(deltaX) > Math.abs(e.changedTouches[0].clientY - touchStartY)) {
                                handleSwipe(listItem, deltaX);
                            } else {
                                if (listItem.classList.contains('options-active')) {
                                    closeOptions(listItem);
                                }
                            }
                            const optionsElement = listItem.querySelector('.swipe-options-container');
                            if (optionsElement) {
                                optionsElement.style.transform = '';
                            }
                        }
                    }
                    isSwipingOrScrolling = false;
                    isLongPress = false;
                    touchStartX = 0;
                    touchStartY = 0;
                });

                listItem.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                });

                intervalContainer.appendChild(listItem);
            });

            if (isSortableMode) {
                enableSortable();
            } else if (sortableInstance) {
                sortableInstance.destroy();
                sortableInstance = null;
            }
            
            lucide.createIcons();
        }

        function enableSortableMode() {
            isSortableMode = true;
            saveButton.textContent = 'Save Order';
            addIntervalButton.classList.add('disabled');
            addIntervalButton.setAttribute('disabled', 'true');
            const listItems = intervalContainer.querySelectorAll('.interval-item');
            listItems.forEach(item => item.classList.add('sortable-mode'));
            if (activeOptionsItem) {
                closeOptions(activeOptionsItem);
            }
            enableSortable();
        }

        function disableSortableMode() {
            isSortableMode = false;
            saveButton.textContent = 'Save';
            addIntervalButton.classList.remove('disabled');
            addIntervalButton.removeAttribute('disabled');
            const listItems = intervalContainer.querySelectorAll('.interval-item');
            listItems.forEach(item => item.classList.remove('sortable-mode'));
            if (sortableInstance) {
                sortableInstance.destroy();
                sortableInstance = null;
            }
            renderIntervalList();
        }

        function enableSortable() {
            if (!sortableInstance) {
                sortableInstance = new Sortable(intervalContainer, {
                    animation: 250,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
                    forceFallback: true,
                    fallbackOnBody: true,
                    fallbackClass: 'sortable-fallback',
                    fallbackTolerance: 3,
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    dragClass: 'sortable-drag',
                    delay: 0,
                    swapThreshold: 0.65,
                    invertSwap: true,
                    handle: '.interval-item > div:first-child',
                    filter: '.swipe-options-container',
                    preventOnFilter: false,
                    dataIdAttr: 'data-interval-id',
                    onStart: function(evt) {
                        triggerHapticFeedback([10, 30, 10]);
                    },
                    onEnd: function (evt) {
                        triggerHapticFeedback(10);
                        const newOrderIds = sortableInstance.toArray();
                        const newIntervals = newOrderIds.map(id => intervals.find(item => item.id === id));
                        intervals = newIntervals;
                    },
                });
            }
        }

        saveButton.addEventListener('click', () => {
            if (isSortableMode) {
                disableSortableMode();
                let allTimers = loadTimers();
                const timerIndex = allTimers.findIndex(t => t.id === currentTimerId);
                if (timerIndex !== -1) {
                    allTimers[timerIndex].intervals = intervals;
                    saveTimers(allTimers);
                }
                return;
            }

            const timerName = timerNameInput.value.trim();
            const repeatCount = parseInt(repeatInput.value, 10);

            if (!timerName) {
                alert('Timer name cannot be empty.');
                return;
            }
            if (isNaN(repeatCount) || repeatCount < 1) {
                alert('Repeat count must be at least 1.');
                return;
            }
            if (intervals.length === 0) {
                alert('A timer must have at least one interval.');
                return;
            }

            // Aktuelle Timer aus localStorage laden (für neueste Daten)
            let allTimers = loadTimers();
            const currentTimer = allTimers.find(t => t.id === currentTimerId);

            let timerToSave = {
                id: currentTimerId,
                name: timerName,
                repeat: repeatCount,
                intervals: intervals.map(interval => {
                    // Hole die aktuellste Version des Intervals aus localStorage
                    const storedInterval = currentTimer?.intervals.find(i => i.id === interval.id);

                    return {
                        ...storedInterval, // Alle gespeicherten Eigenschaften (inklusive signals!)
                        ...interval, // Aktuelle Eigenschaften aus dem Editor
                        // Stelle sicher dass signals erhalten bleibt
                        signals: storedInterval?.signals || interval.signals || {}
                    };
                })
            };

            const index = allTimers.findIndex(t => t.id === currentTimerId);
            if (index !== -1) {
                allTimers[index] = timerToSave;
            } else {
                allTimers.push(timerToSave);
            }

            saveTimers(allTimers);
            console.log('Timer gespeichert mit Sound-Einstellungen:', timerToSave);
            window.location.href = '../home-screen/index.html';
        });

        addIntervalButton.addEventListener('click', () => {
            if (isSortableMode) {
                return;
            }
            window.location.href = `../interval-editor/interval-editor.html?timerId=${currentTimerId}`;
        });

        window.addEventListener('scroll', () => {
            if (window.scrollY > 0) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        document.addEventListener('click', (event) => {
            const openOptions = document.querySelector('.interval-item.options-active .swipe-options-container');
            if (openOptions && !event.target.closest('.interval-item.options-active')) {
                const activeListItem = document.querySelector('.interval-item.options-active');
                if (activeListItem) {
                    closeOptions(activeListItem);
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const timerId = urlParams.get('timerId');

            if (!timerId) {
                console.error('Keine timerId in der URL gefunden');
                alert('Timer-ID fehlt. Bitte erneut versuchen.');
                window.location.href = '../home-screen/index.html';
                return;
            }

            currentTimerId = timerId;
            let allTimers = loadTimers();
            let timerToLoad = allTimers.find(t => t.id === timerId);

            if (!timerToLoad) {
                // Neuer Timer, falls nicht in localStorage gefunden
                timerToLoad = {
                    id: currentTimerId,
                    name: 'New Timer',
                    repeat: 1,
                    intervals: []
                };
                allTimers.push(timerToLoad);
                saveTimers(allTimers);
            }

            headerTitle.textContent = timerToLoad.name !== 'New Timer' ? 'Edit Timer' : 'Add Timer';
            timerNameInput.value = timerToLoad.name;
            repeatInput.value = timerToLoad.repeat;
            intervals = JSON.parse(JSON.stringify(timerToLoad.intervals || []));
            intervals = intervals.map(interval => ({
                ...interval,
                signals: interval.signals || {} // Stelle sicher dass signals-Objekt existiert
            }));
            renderIntervalList();

            timerNameInput.addEventListener('input', () => {
                let allTimers = loadTimers();
                const timerIndex = allTimers.findIndex(t => t.id === currentTimerId);
                if (timerIndex !== -1) {
                    allTimers[timerIndex].name = timerNameInput.value.trim() || 'New Timer';
                    saveTimers(allTimers);
                }
            });
        });
    </script>
</body>

</html>
