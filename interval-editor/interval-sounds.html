<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>Interval Sounds</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <script src="../js/dataStorage.js"></script>
    <script src="../js/ui-config.js"></script>
    
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #09090b;
            font-family: 'Inter', sans-serif;
            color: #fafafa;
            overscroll-behavior: none;
            scroll-padding-top: 4rem;
            scroll-behavior: smooth;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 1rem;
            background-color: rgba(9, 9, 11, 0.85); /* Zinc 950 */
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #27272a; /* Zinc 800 */
        }

        header::before {
            content: "";
            position: absolute;
            top: -100vh;
            left: 0;
            right: 0;
            height: 100vh;
            background-color: #09090b;
            z-index: -1;
        }

        .sound-select {
            width: 100%;
            background-color: #18181b; /* Zinc 900 */
            color: #fafafa;
            border: 1px solid #27272a; /* Zinc 800 */
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 1.125rem;
            margin-bottom: 1.5rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .sound-select:focus {
            border-color: #f97316; /* Vermillion */
        }

        .sound-group {
            margin-bottom: 2rem;
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 1rem;
            padding: 1.25rem;
        }

        .sound-group-label {
            display: block;
            margin-bottom: 0.75rem;
            color: #textMuted;
            font-weight: 500;
        }

        .global-default-option {
            font-style: italic;
            color: #a1a1aa; /* Zinc 400 */
        }
    </style>
</head>

<body class="text-textMain">
    <header id="header" class="text-textMain">
        <div class="w-full flex justify-between items-center">
            <a href="../interval-editor/interval-editor.html" id="back-button"
                class="p-2 -ml-2 rounded-full active:bg-surfaceBorder transition-colors" onclick="triggerHapticFeedback(10)">
                <i data-lucide="chevron-left" class="w-6 h-6 text-primary"></i>
            </a>
            <h1 class="text-xl font-semibold tracking-wide">Interval Sounds</h1>
            <button id="save-button" class="text-primary font-semibold tracking-wide p-2 -mr-2 rounded-full active:bg-surfaceBorder transition-colors" onclick="triggerHapticFeedback(20)">
                Save
            </button>
        </div>
    </header>

    <div class="p-4 pt-6 max-w-lg mx-auto">
        <p class="text-textMuted font-medium mb-6 px-1 text-center">Override global sound settings for this specific interval.</p>

        <div id="sound-controls">
            <!-- Sound-Auswahl wird hier per JavaScript eingefügt -->
        </div>
    </div>

    <script>
        const SOUND_TYPES = [
            { id: 'intervalStart', name: 'Interval Start' },
            { id: 'restStart', name: 'Rest Start' },
            { id: 'halfway', name: 'Halfway Signal' },
            { id: 'threeSecond', name: '3 Second Signal' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const timerId = urlParams.get('timerId');
            const intervalId = urlParams.get('intervalId');

            if (!timerId || !intervalId) {
                console.error('Keine timerId oder intervalId in der URL gefunden');
                window.location.href = '../timer-editor/timer-editor.html';
                return;
            }

            const backButton = document.getElementById('back-button');
            backButton.href = `../interval-editor/interval-editor.html?timerId=${timerId}&intervalId=${intervalId}`;

            window.audioContext = window.audioContext || new (window.AudioContext || window.webkitAudioContext)();
            window.mainGainNode = window.audioContext.createGain();

            const LIMITER_CEILING = 1.5;
            const preLimiterGain = window.audioContext.createGain();
            preLimiterGain.gain.value = 1 / LIMITER_CEILING;

            const compressor = window.audioContext.createDynamicsCompressor();
            compressor.threshold.setValueAtTime(0, window.audioContext.currentTime);
            compressor.knee.setValueAtTime(6, window.audioContext.currentTime);
            compressor.ratio.setValueAtTime(20, window.audioContext.currentTime);
            compressor.attack.setValueAtTime(0.002, window.audioContext.currentTime);
            compressor.release.setValueAtTime(0.1, window.audioContext.currentTime);

            const postLimiterGain = window.audioContext.createGain();
            postLimiterGain.gain.value = LIMITER_CEILING;

            window.mainGainNode.connect(preLimiterGain);
            preLimiterGain.connect(compressor);
            compressor.connect(postLimiterGain);
            postLimiterGain.connect(window.audioContext.destination);

            const volumeBoost = Number(loadVolumeBoost()) || 100;
            const gainValue = volumeBoost / 100;
            window.mainGainNode.gain.value = Math.max(0, gainValue);

            const signals = loadSignals();
            const globalSignals = loadGlobalSignals();
            const noneOption = { id: '', name: 'None' };
            const allSignals = [noneOption, ...signals];

            let timers = loadTimers();
            const timer = timers.find(t => t.id === timerId);
            if (!timer) {
                console.error('Timer nicht gefunden:', timerId);
                window.location.href = '../timer-editor/timer-editor.html';
                return;
            }

            const interval = timer.intervals.find(i => i.id === intervalId);
            if (!interval) {
                console.error('Intervall nicht gefunden:', intervalId);
                window.location.href = `../timer-editor/timer-editor.html?timerId=${timerId}`;
                return;
            }

            if (!interval.signals) {
                interval.signals = {};
            }

            function getSignalNameById(signalId) {
                if (!signalId) return 'None';
                const signal = allSignals.find(s => s.id === signalId);
                return signal ? signal.name : 'Unknown';
            }

            const soundControlsContainer = document.getElementById('sound-controls');

            SOUND_TYPES.forEach(soundType => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'sound-group';

                const label = document.createElement('label');
                label.className = 'sound-group-label';
                label.textContent = soundType.name;
                label.htmlFor = `select-${soundType.id}`;

                const select = document.createElement('select');
                select.className = 'sound-select';
                select.id = `select-${soundType.id}`;

                const individualSignalId = interval.signals[soundType.id];

                let displayValue;
                if (individualSignalId !== undefined && individualSignalId !== null) {
                    displayValue = individualSignalId;
                } else {
                    displayValue = '__GLOBAL__';
                }

                const globalSignalId = globalSignals[soundType.id] || '';
                const globalSignalName = getSignalNameById(globalSignalId);

                const globalOption = document.createElement('option');
                globalOption.value = '__GLOBAL__';
                globalOption.textContent = `Global (${globalSignalName})`;
                globalOption.className = 'global-default-option';
                if (displayValue === '__GLOBAL__') {
                    globalOption.selected = true;
                }
                select.appendChild(globalOption);

                allSignals.forEach(signal => {
                    const option = document.createElement('option');
                    option.value = signal.id === '' ? '__NONE__' : signal.id;
                    option.textContent = signal.name;
                    if ((displayValue === '' && signal.id === '') || 
                        (displayValue === '__NONE__' && signal.id === '') ||
                        (displayValue === signal.id)) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });

                select.addEventListener('change', function () {
                    let selectedSignal;
                    if (this.value === '__GLOBAL__') {
                        const globalId = globalSignals[soundType.id] || '';
                        selectedSignal = allSignals.find(s => s.id === globalId);
                    } else if (this.value === '__NONE__') {
                        return;
                    } else {
                        selectedSignal = allSignals.find(s => s.id === this.value);
                    }

                    if (selectedSignal && selectedSignal.filePath) {
                        if (window.audioContext.state === 'suspended') {
                            window.audioContext.resume().then(() => {
                                playSignal(selectedSignal.filePath);
                            }).catch(e => console.error('Fehler beim Resumen:', e));
                        } else {
                            playSignal(selectedSignal.filePath);
                        }
                    }
                });

                groupDiv.appendChild(label);
                groupDiv.appendChild(select);
                soundControlsContainer.appendChild(groupDiv);
            });

            const previewAudioBuffers = {};

            async function playSignal(filePath) {
                const currentPath = window.location.pathname;
                let basePath;

                if (currentPath.includes('Timer-App')) {
                    basePath = window.location.origin + '/Timer-App/';
                } else {
                    basePath = '../';
                }

                const fullPath = `${basePath}${filePath}`;

                try {
                    if (window.audioContext.state === 'suspended') {
                        await window.audioContext.resume();
                    }

                    if (!previewAudioBuffers[fullPath]) {
                        const res = await fetch(fullPath);
                        const ab = await res.arrayBuffer();
                        previewAudioBuffers[fullPath] = await window.audioContext.decodeAudioData(ab);
                    }

                    const source = window.audioContext.createBufferSource();
                    source.buffer = previewAudioBuffers[fullPath];
                    source.connect(window.mainGainNode);
                    source.start(0);
                    console.log(`Spiele Signal: ${fullPath}`);
                } catch (e) {
                    console.error('Fehler beim Abspielen via AudioBuffer:', e);
                    const fallbackAudio = new Audio(fullPath);
                    fallbackAudio.volume = Math.min(1.0, (Number(loadVolumeBoost()) || 100) / 100);
                    fallbackAudio.play().catch(err => console.error('Fallback-Fehler:', err));
                }
            }

            document.getElementById('save-button').addEventListener('click', () => {
                timers = loadTimers();
                const timerIndex = timers.findIndex(t => t.id === timerId);
                if (timerIndex !== -1) {
                    const intervalIndex = timers[timerIndex].intervals.findIndex(i => i.id === intervalId);
                    if (intervalIndex !== -1) {
                        if (!timers[timerIndex].intervals[intervalIndex].signals) {
                            timers[timerIndex].intervals[intervalIndex].signals = {};
                        }

                        SOUND_TYPES.forEach(soundType => {
                            const selectElement = document.getElementById(`select-${soundType.id}`);
                            const selectedValue = selectElement.value;

                            if (selectedValue === '__GLOBAL__') {
                                delete timers[timerIndex].intervals[intervalIndex].signals[soundType.id];
                            } else if (selectedValue === '__NONE__') {
                                timers[timerIndex].intervals[intervalIndex].signals[soundType.id] = '__NONE__';
                            } else {
                                timers[timerIndex].intervals[intervalIndex].signals[soundType.id] = selectedValue;
                            }
                            console.log('Speichere Sounds für Intervall:', intervalId);
                            console.log('Aktuelles signals-Objekt:', timers[timerIndex].intervals[intervalIndex].signals);
                        });

                        saveTimers(timers);
                        console.log('Alle Sounds gespeichert für Intervall:', intervalId);
                    }
                }
                const verifyTimers = loadTimers();
                const verifyTimer = verifyTimers.find(t => t.id === timerId);
                const verifyInterval = verifyTimer?.intervals.find(i => i.id === intervalId);
                console.log('Verifikation - Gespeicherte Sounds:', verifyInterval?.signals);

                window.location.href = `../interval-editor/interval-editor.html?timerId=${timerId}&intervalId=${intervalId}`;
            });

            const header = document.querySelector('header');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 0) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });
        });
    </script>
</body>

</html>
