<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#09090b" />
    <title>Timer Screen</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="../js/dataStorage.js"></script>
    <script src="../js/ui-config.js"></script>
    
    <style>
        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #09090b; /* Zinc 950 default */
            transition: background-color 0.5s ease;
            color: #fafafa;
        }

        body {
            display: flex;
            flex-direction: column;
            background-color: var(--current-bg-color, #09090b);
        }

        header {
            flex-shrink: 0;
            padding: 1rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            padding: 0 1rem;
        }

        .upper-half {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding-bottom: 2rem;
            padding-top: 2rem;
            transition: all 0.3s ease;
        }

        .start-circle {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 700;
            color: #fafafa;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
            background-color: var(--current-circle-color, #27272a);
            border: 2px solid rgba(255,255,255,0.05);
        }

        .start-circle:active {
            transform: scale(0.96);
        }

        .start-circle .countdown-time {
            font-size: 5.5rem;
            line-height: 1;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        .start-circle .countdown-label {
            font-size: 1.25rem;
            font-weight: 500;
            opacity: 0.9;
            margin-top: 0.5rem;
        }

        .interval-list-container {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            margin-bottom: 1rem;
            padding: 0 0.5rem;
        }

        .interval-list-container::-webkit-scrollbar {
            display: none;
        }

        .interval-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            border-radius: 1rem;
            background-color: #18181b; /* Zinc 900 */
            border: 1px solid #27272a;
            transition: all 0.3s ease;
            font-size: 1.125rem;
            color: #a1a1aa; /* textMuted */
        }

        .interval-item.active {
            background-color: #27272a; /* Zinc 800 */
            border-color: #3f3f46; /* Zinc 700 */
            color: #fafafa;
            font-weight: 600;
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .interval-item-name {
            flex-grow: 1;
            text-align: left;
        }

        .interval-item-time {
            flex-shrink: 0;
            text-align: right;
            font-weight: 600;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        footer {
            flex-shrink: 0;
            padding: 1rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            padding-bottom: env(safe-area-inset-bottom, 1.5rem);
        }

        footer button {
            padding: 1rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 1.125rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 4rem;
            height: 4rem;
        }

        footer button:active {
            transform: scale(0.92);
        }

        .btn-end {
            background-color: #27272a;
            color: #fafafa;
        }

        .btn-pause {
            background-color: #f97316; /* Vermillion */
            color: #fafafa;
            box-shadow: 0 4px 14px 0 rgba(249, 115, 22, 0.39);
        }

        /* Color States */
        /* Darker tinted backgrounds instead of bright colors */
        .bg-interval { background-color: #1a0806; } /* Very dark crimson tint */
        .bg-rest { background-color: #051409; } /* Very dark jade tint */
        .bg-warning { background-color: #1a0c02; } /* Very dark vermillion tint */
        .bg-initial { background-color: #09090b; } /* Zinc 950 */

        /* Vibrant circle colors */
        .circle-interval { background-color: #eb4639; box-shadow: 0 0 40px rgba(235, 70, 57, 0.4); } /* Light Crimson */
        .circle-rest { background-color: #22c55e; box-shadow: 0 0 40px rgba(34, 197, 94, 0.4); } /* Soft Jade */
        .circle-warning { background-color: #f97316; box-shadow: 0 0 40px rgba(249, 115, 22, 0.4); } /* Light Vermillion */
        .circle-initial { background-color: #27272a; } /* Zinc 800 */

        /* Dialogs */
        .confirmation-dialog-overlay,
        .completion-dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .confirmation-dialog-overlay.active,
        .completion-dialog-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .confirmation-dialog,
        .completion-dialog {
            background-color: #18181b; /* Zinc 900 */
            padding: 2rem;
            border-radius: 1.5rem;
            border: 1px solid #27272a;
            text-align: center;
            max-width: 90%;
            width: 320px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
        }

        .confirmation-dialog-overlay.active .confirmation-dialog,
        .completion-dialog-overlay.active .completion-dialog {
            transform: translateY(0);
            opacity: 1;
        }

        .dialog-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #fafafa;
        }

        .dialog-message {
            font-size: 1.125rem;
            color: #a1a1aa;
            margin-bottom: 2rem;
        }

        .dialog-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .dialog-btn {
            padding: 1rem;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 1.125rem;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            width: 100%;
        }

        .dialog-btn:active {
            transform: scale(0.97);
        }

        .btn-confirm {
            background-color: #eb4639;
            color: #ffffff;
        }

        .btn-cancel {
            background-color: transparent;
            color: #fafafa;
            border: 1px solid #27272a;
        }

        .btn-finish {
            background-color: #22c55e;
            color: #ffffff;
        }

        /* Landscape adjustments */
        @media (orientation: landscape) {
            header, footer {
                display: none !important;
            }

            body {
                justify-content: center;
                align-items: center;
            }

            .main-content {
                padding: 0;
                width: 100%;
                height: 100%;
                justify-content: center;
            }

            .upper-half {
                padding: 0;
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: row;
                justify-content: space-evenly;
                align-items: center;
            }

            .interval-list-container {
                display: none !important; /* Hide interval list in landscape for fullscreen timer */
            }

            .start-circle {
                width: 90vmin;
                height: 90vmin;
                max-width: none;
                max-height: none;
            }
            
            .start-circle .countdown-time {
                font-size: 15vmin;
            }

            #timer-display-area > div.flex {
                flex-direction: column;
                gap: 1rem;
                justify-content: center;
                align-items: center;
                height: 100%;
                padding: 1rem;
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body class="bg-initial">
    <header id="app-header">
        <button class="p-2 -ml-2 rounded-full active:bg-surfaceBorder transition-colors" onclick="triggerHapticFeedback(10); window.history.back();">
            <i data-lucide="chevron-left" class="w-6 h-6 text-primary"></i>
        </button>
        <h1 class="text-xl font-semibold tracking-wide" id="timer-title">Mein Timer</h1>
        <div class="w-10"></div> <!-- Placeholder for centering -->
    </header>

    <div class="main-content">
        <div class="upper-half" id="timer-display-area">
            <div class="start-circle" id="main-circle" onclick="triggerHapticFeedback(10)">
                <span id="circle-text">START</span>
                <span id="circle-countdown" class="countdown-time hidden">00:00</span>
                <span id="circle-total-countdown" class="countdown-label hidden">Total: 00:00</span>
            </div>

            <div class="flex justify-between items-center w-full max-w-xs mt-6 px-4">
                <span id="current-interval-number" class="text-xl font-semibold text-primary">00/00</span>
                <span id="total-countdown-below-circle" class="text-lg font-medium text-textMuted">Total: 00:00</span>
            </div>
        </div>

        <div class="interval-list-container" id="interval-list-container"></div>
    </div>

    <footer>
        <button class="btn-end" id="end-button" onclick="triggerHapticFeedback(20)">
            <i data-lucide="square" class="w-6 h-6"></i>
        </button>
    </footer>

    <!-- End Confirmation Dialog -->
    <div class="confirmation-dialog-overlay" id="end-confirmation-dialog">
        <div class="confirmation-dialog">
            <h3 class="dialog-title">End Timer?</h3>
            <p class="dialog-message">Are you sure you want to stop the current workout?</p>
            <div class="dialog-buttons">
                <button class="dialog-btn btn-confirm" id="confirm-end" onclick="triggerHapticFeedback([10, 30])">End Workout</button>
                <button class="dialog-btn btn-cancel" id="cancel-end" onclick="triggerHapticFeedback(10)">Resume</button>
            </div>
        </div>
    </div>

    <!-- Completion Dialog -->
    <div class="completion-dialog-overlay" id="completion-dialog">
        <div class="completion-dialog">
            <h3 class="dialog-title">Workout Complete!</h3>
            <p class="dialog-message">You are Awesome!</p>
            <div class="dialog-buttons">
                <button class="dialog-btn btn-finish" id="restart-timer" onclick="triggerHapticFeedback(20)">Restart Timer</button>
                <button class="dialog-btn btn-cancel" id="end-timer" onclick="triggerHapticFeedback(10)">Close</button>
            </div>
        </div>
    </div>

    <script>
        const body = document.body;
        const mainCircle = document.getElementById('main-circle');
        const circleText = document.getElementById('circle-text');
        const circleCountdown = document.getElementById('circle-countdown');
        const circleTotalCountdown = document.getElementById('circle-total-countdown');
        const currentIntervalNumberDisplay = document.getElementById('current-interval-number');
        const totalCountdownBelowCircle = document.getElementById('total-countdown-below-circle');
        const endButton = document.getElementById('end-button');
        const endConfirmationDialog = document.getElementById('end-confirmation-dialog');
        const cancelEndButton = document.getElementById('cancel-end');
        const confirmEndButton = document.getElementById('confirm-end');
        const completionDialog = document.getElementById('completion-dialog');
        const restartTimerButton = document.getElementById('restart-timer');
        const endTimerButton = document.getElementById('end-timer');
        const intervalListContainer = document.getElementById('interval-list-container');
        const timerTitle = document.getElementById('timer-title');
        let intervalItems = [];

        let isTimerRunning = false;
        let isTimerPaused = false;
        let currentIntervalIndex = 0;
        let currentIntervalTimeRemaining = 0;
        let totalTimeRemaining = 0;
        let timerIntervalId;
        let timerIntervalsData = [];
        let halfwayPoint = 0;
        let currentRepeat = 1;
        let maxRepeats = 1;
        let currentTimer = null; // Aktueller Timer für Sound-Auswahl

        // Audio Setup
        let audioPlayers = {};
        let audioBuffers = {};
        let isAudioInitialized = false;
        const MAX_RETRIES = 3;
        const RETRY_DELAY = 100;
        let soundQueue = [];
        const POOL_SIZE = 3;

        // Funktion zum asynchronen Laden von Audiodateien
        async function loadAudioFile(filePath) {
            try {
                // Bestimme die korrekte Basis-URL
                const currentPath = window.location.pathname;
                let basePath;

                if (currentPath.includes('Timer-App')) {
                    // GitHub Pages
                    basePath = window.location.origin + '/Timer-App/';
                } else {
                    // Lokale Entwicklung
                    basePath = '../';
                }

                const fullPath = `${basePath}${filePath}`;
                const response = await fetch(fullPath, { cache: 'force-cache' });
                if (!response.ok) {
                    throw new Error(`Fehler beim Laden der Audiodatei: ${fullPath}, Status: ${response.status}`);
                }
                const arrayBuffer = await response.arrayBuffer();
                const audio = new Audio(fullPath);
                audio.preload = 'auto';
                await new Promise((resolve, reject) => {
                    audio.addEventListener('canplaythrough', resolve, { once: true });
                    audio.addEventListener('error', reject, { once: true });
                });
                console.log(`Audiodatei geladen: ${fullPath}`);
                return { audio, arrayBuffer };
            } catch (error) {
                console.error(`Fehler beim Laden der Audiodatei ${filePath}:`, error);
                return null;
            }
        }

       function getSoundIdForInterval(currentIntervalIndex, soundType) {
  if (!currentTimer || !currentTimer.intervals || currentTimer.intervals.length === 0) {
    console.log('Kein Timer oder keine Intervalle vorhanden');
    const globalSignals = loadGlobalSignals();
    return globalSignals[soundType] || '';
  }

  // Zähle ANHALTENDE Intervalle bis zum aktuellen Index (nicht darüber hinaus!)
  let roundIndex = 0;
  for (let i = 0; i < currentIntervalIndex; i++) {  // Änderung: < currentIntervalIndex
    if (timerIntervalsData[i].type === 'interval') {
      roundIndex++;
    }
  }

  // Wenn wir UNS gerade in einem interval befinden, inkrementiere für diesen
  if (timerIntervalsData[currentIntervalIndex].type === 'interval') {
    roundIndex++;
  }
  // Bei rest bleibt roundIndex gleich (gehört zum vorherigen interval)

  // Klammer an verfügbare Runden
  if (roundIndex >= currentTimer.intervals.length) {
    roundIndex = currentTimer.intervals.length - 1;
  }

  const interval = currentTimer.intervals[roundIndex];

  console.log(`getSoundIdForInterval: currentIntervalIndex=${currentIntervalIndex}, roundIndex=${roundIndex}, type=${timerIntervalsData[currentIntervalIndex]?.type || 'unknown'}, soundType=${soundType}`);

  if (interval.signals && interval.signals[soundType] !== undefined) {
    const signalValue = interval.signals[soundType];
    if (signalValue === '__NONE__') return null;
    if (signalValue !== '' && signalValue !== null) return signalValue;
  }

  const globalSignals = loadGlobalSignals();
  return globalSignals[soundType] || '';
}

        // Initialisierung des AudioContext und der Audio-Player
        async function initAudio() {
            if (isAudioInitialized) {
                console.log('Audio bereits initialisiert');
                return;
            }

            try {
                window.audioContext = window.audioContext || new (window.AudioContext || window.webkitAudioContext)();
                window.mainGainNode = window.audioContext.createGain();
                window.mainGainNode.connect(window.audioContext.destination);

                const volumeBoost = Number(loadVolumeBoost()) || 100;
                const gainValue = 0.5 + (volumeBoost - 50) / 100;
                window.mainGainNode.gain.value = Math.max(0, gainValue);
                console.log(`AudioContext initialisiert: ${window.audioContext.state}, Gain: ${gainValue}`);
            } catch (error) {
                console.error('Fehler beim Initialisieren des AudioContext:', error);
            }

            const signals = loadSignals();
            const globalSignals = loadGlobalSignals();
            const soundsToLoad = new Map();

            const soundTypes = ['intervalStart', 'restStart', 'halfway', 'threeSecond', 'lastRound'];

            soundTypes.forEach(type => {
                const globalSignalId = globalSignals[type];
                if (globalSignalId && globalSignalId !== '') {
                    const globalSignal = signals.find(s => s.id === globalSignalId);
                    if (globalSignal && globalSignal.filePath) {
                        soundsToLoad.set(globalSignalId, {
                            signalId: globalSignalId,
                            filePath: globalSignal.filePath,
                            type: type
                        });
                    }
                }
            });

            if (currentTimer && currentTimer.intervals) {
                currentTimer.intervals.forEach((interval, intervalIndex) => {
                    if (interval.signals) {
                        soundTypes.forEach(type => {
                            const customSignalId = interval.signals[type];
                            if (customSignalId && customSignalId !== '' && customSignalId !== '__NONE__' && !soundsToLoad.has(customSignalId)) {
                                const customSignal = signals.find(s => s.id === customSignalId);
                                if (customSignal && customSignal.filePath) {
                                    soundsToLoad.set(customSignalId, {
                                        signalId: customSignalId,
                                        filePath: customSignal.filePath,
                                        type: type
                                    });
                                }
                            }
                        });
                    }
                });
            }

            console.log(`Lade ${soundsToLoad.size} einzigartige Sounds...`);

            // Lade alle gesammelten Sounds
            const audioPromises = Array.from(soundsToLoad.values()).map(async (soundInfo) => {
                const result = await loadAudioFile(soundInfo.filePath);
                if (result) {
                    const { audio, arrayBuffer } = result;
                    const signalId = soundInfo.signalId;
                    const type = soundInfo.type;

                    if (type === 'threeSecond' || type === 'intervalStart' || type === 'restStart' || type === 'halfway') {
                        try {
                            audioBuffers[signalId] = await window.audioContext.decodeAudioData(arrayBuffer);
                            console.log(`AudioBuffer erstellt für ${signalId}: ${soundInfo.filePath}`);
                        } catch (error) {
                            console.error(`Fehler beim Dekodieren von ${signalId}:`, error);
                            audioPlayers[signalId] = audio;
                        }
                    } else {
                        try {
                            const source = window.audioContext.createMediaElementSource(audio);
                            source.connect(window.mainGainNode);
                            audioPlayers[signalId] = audio;
                            console.log(`Audio-Player erstellt für ${signalId}: ${soundInfo.filePath}`);
                        } catch (error) {
                            console.error(`Fehler bei createMediaElementSource für ${signalId}:`, error);
                            audio.volume = volumeBoost / 100;
                            audioPlayers[signalId] = audio;
                        }
                    }
                }
            });

            await Promise.all(audioPromises);
            isAudioInitialized = true;

            Object.keys(audioBuffers).forEach(signalId => {
                audioPlayers[`${signalId}Pool`] = Array(POOL_SIZE).fill().map(() => ({
                    source: null,
                    available: true
                }));
            });

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && window.audioContext && window.audioContext.state === 'suspended') {
                    window.audioContext.resume().then(() => {
                        console.log('AudioContext fortgesetzt:', window.audioContext.state);
                    }).catch(error => console.error('Fehler beim Fortsetzen des AudioContext:', error));
                }
            });

            document.addEventListener('click', resumeAudioContext, { once: true });
        }

        function resumeAudioContext() {
            if (window.audioContext && window.audioContext.state === 'suspended') {
                window.audioContext.resume().then(() => {
                    console.log('AudioContext nach Benutzerinteraktion fortgesetzt:', window.audioContext.state);
                }).catch(error => console.error('Fehler beim Fortsetzen des AudioContext:', error));
            }
        }

        function playPooledSound(signalId) {
            if (!audioBuffers[signalId] || !window.audioContext) {
                console.warn(`AudioBuffer oder AudioContext nicht verfügbar für ${signalId}`);
                playAudio(signalId, 0);
                return;
            }

            const startTime = performance.now();
            const pool = audioPlayers[`${signalId}Pool`];
            if (!pool) {
                console.warn(`Kein Audio-Pool für ${signalId}`);
                playAudio(signalId, 0);
                return;
            }

            const poolItem = pool.find(item => item.available);
            if (!poolItem) {
                console.warn(`Kein verfügbarer Audio-Pool für ${signalId}`);
                return;
            }

            try {
                poolItem.available = false;
                poolItem.source = window.audioContext.createBufferSource();
                poolItem.source.buffer = audioBuffers[signalId];
                poolItem.source.connect(window.mainGainNode);
                poolItem.source.addEventListener('ended', () => {
                    poolItem.available = true;
                    console.log(`${signalId} Audio-Pool freigegeben`);
                }, { once: true });
                poolItem.source.start(0);
                const endTime = performance.now();
                console.log(`${signalId} abgespielt, Latenz: ${endTime - startTime}ms`);
            } catch (error) {
                console.error(`Fehler beim Abspielen von ${signalId} mit AudioBuffer:`, error);
                poolItem.available = true;
                playAudio(signalId, 0);
            }
        }

        // Funktion zum Abspielen eines Sounds
        async function playSound(type, immediate = false) {
            if (!isAudioInitialized) {
                await initAudio();
            }

            // Ermittle den korrekten Sound basierend auf dem aktuellen Intervall
            let signalId;
            if (type === 'lastRound') {
                // lastRound ist immer global
                const globalSignals = loadGlobalSignals();
                signalId = globalSignals[type] || '';
            } else {
                // Für andere Sound-Typen ermittle den intervallspezifischen oder globalen Sound
                const timerIntervalIndex = Math.floor(currentIntervalIndex / 2);
                signalId = getSoundIdForInterval(currentIntervalIndex, type);
            }

            // Wenn signalId null ist (explizit "__NONE__" gewählt), spiele keinen Sound
            if (signalId === null) {
                console.log(`Kein Sound für ${type} (explizit None gewählt)`);
                return;
            }

            if (!signalId || signalId === '') {
                console.log(`Kein Sound ausgewählt für: ${type}`);
                return;
            }

            console.log(`Spiele Sound: type=${type}, intervalIndex=${currentIntervalIndex}, signalId=${signalId}`);

            if (type === 'threeSecond' || type === 'intervalStart' || type === 'restStart' || type === 'halfway') {
                playPooledSound(signalId);
            } else if (immediate) {
                await playAudio(signalId, 0);
            } else {
                soundQueue.push(signalId);
                if (soundQueue.length === 1) {
                    playNextSound();
                }
            }
        }

        // Funktion zum Abspielen des nächsten Sounds in der Warteschlange
        async function playNextSound(retryCount = 0) {
            if (soundQueue.length === 0) {
                return;
            }

            const signalId = soundQueue[0];
            if (!isAudioInitialized) {
                await initAudio();
            }

            if (!window.audioContext) {
                console.warn('AudioContext nicht verfügbar für:', signalId);
                soundQueue.shift();
                playNextSound();
                return;
            }

            if (window.audioContext.state === 'suspended') {
                window.audioContext.resume().then(() => {
                    console.log('AudioContext fortgesetzt vor Sound-Wiedergabe:', window.audioContext.state);
                    playAudio(signalId, retryCount);
                }).catch(error => {
                    console.error('Fehler beim Fortsetzen des AudioContext:', error);
                    playAudio(signalId, retryCount);
                });
            } else {
                playAudio(signalId, retryCount);
            }
        }

        // Interne Funktion zum Abspielen eines Sounds
        async function playAudio(signalId, retryCount) {
            const startTime = performance.now();
            console.log(`Spiele Sound mit signalId: ${signalId}`);

            const audio = audioPlayers[signalId];
            if (!audio) {
                console.warn(`Kein Audio-Player für signalId: ${signalId}`);
                if (soundQueue[0] === signalId) soundQueue.shift();
                playNextSound();
                return;
            }

            try {
                audio.currentTime = 0;
                await audio.play();
                const endTime = performance.now();
                console.log(`Sound abgespielt: ${signalId}, Latenz: ${endTime - startTime}ms`);
                if (soundQueue[0] === signalId) soundQueue.shift();
                playNextSound();
            } catch (error) {
                console.error(`Fehler beim Abspielen von ${signalId} (Versuch ${retryCount + 1}):`, error);
                if (retryCount < MAX_RETRIES) {
                    console.log(`Wiederhole Sound-Wiedergabe für ${signalId} in ${RETRY_DELAY}ms`);
                    setTimeout(() => playAudio(signalId, retryCount + 1), RETRY_DELAY);
                } else {
                    console.error(`Maximale Wiederholungen erreicht für ${signalId}. Sound konnte nicht abgespielt werden.`);
                    if (soundQueue[0] === signalId) soundQueue.shift();
                    playNextSound();
                }
            }
        }

        // --- Hilfsfunktionen ---

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateBackgroundAndCircleColor(type, isWarning = false) {
            body.classList.remove('bg-interval', 'bg-rest', 'bg-warning', 'bg-initial');
            mainCircle.classList.remove('circle-interval', 'circle-rest', 'circle-warning', 'circle-initial');

            if (isWarning) {
                body.classList.add('bg-warning');
                mainCircle.classList.add('circle-warning');
            } else if (type === 'interval') {
                body.classList.add('bg-interval');
                mainCircle.classList.add('circle-interval');
            } else if (type === 'rest') {
                body.classList.add('bg-rest');
                mainCircle.classList.add('circle-rest');
            } else {
                body.classList.add('bg-initial');
                mainCircle.classList.add('circle-initial');
            }
        }

        function highlightCurrentInterval() {
            intervalItems.forEach((item, index) => {
                item.classList.remove('active');
                if (index === currentIntervalIndex) {
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }

        function updateCircleContent() {
            if (isTimerRunning && !isTimerPaused) {
                circleText.classList.add('hidden');
                circleCountdown.textContent = formatTime(currentIntervalTimeRemaining);
                circleCountdown.classList.remove('hidden');
                circleTotalCountdown.classList.add('hidden');
            } else if (isTimerPaused) {
                circleText.textContent = 'START';
                circleText.classList.remove('hidden');
                circleCountdown.classList.add('hidden');
                circleTotalCountdown.classList.add('hidden');
            } else {
                circleText.textContent = 'START';
                circleText.classList.remove('hidden');
                circleCountdown.classList.add('hidden');
                circleTotalCountdown.classList.add('hidden');
            }
        }

        function updateSecondaryDisplays() {
            const intervalsPerCycle = timerIntervalsData.filter(item => item.type === 'interval').length;
            const totalIntervals = intervalsPerCycle * maxRepeats;
            
            let intervalCount = (currentRepeat - 1) * intervalsPerCycle;
            for (let i = 0; i <= currentIntervalIndex; i++) {
                if (timerIntervalsData[i].type === 'interval') {
                    intervalCount++;
                }
            }
            currentIntervalNumberDisplay.textContent = `${intervalCount.toString().padStart(2, '0')} / ${totalIntervals.toString().padStart(2, '0')}`;
            totalCountdownBelowCircle.textContent = `Total: ${formatTime(totalTimeRemaining)}`;
        }

        // --- Timer-Logik ---

        function startTimer() {
            if (!isTimerRunning && !isTimerPaused) {
                currentIntervalIndex = 0;
                currentRepeat = 1;
                const singleCycleTime = timerIntervalsData.reduce((sum, item) => sum + item.duration, 0);
                totalTimeRemaining = singleCycleTime * maxRepeats;
                currentIntervalTimeRemaining = timerIntervalsData[currentIntervalIndex].duration;
                halfwayPoint = Math.floor(currentIntervalTimeRemaining / 2);
                const type = timerIntervalsData[currentIntervalIndex].type;
                console.log(`Starte Timer, Intervalltyp: ${type}`);
                playSound(type === 'interval' ? 'intervalStart' : 'restStart');
            } else if (isTimerPaused) {
                halfwayPoint = Math.floor(currentIntervalTimeRemaining / 2);
            }

            isTimerRunning = true;
            isTimerPaused = false;

            updateCircleContent();
            updateSecondaryDisplays();
            highlightCurrentInterval();
            updateBackgroundAndCircleColor(timerIntervalsData[currentIntervalIndex].type);

            timerIntervalId = setInterval(() => {
                if (isTimerPaused) return;

                currentIntervalTimeRemaining--;
                totalTimeRemaining--;

                if (timerIntervalsData[currentIntervalIndex].type === 'interval' &&
                    currentIntervalTimeRemaining === halfwayPoint) {
                    playSound('halfway');
                }

                // 3-Sekunden-Sound jede Sekunde in den letzten 3 Sekunden
                if (currentIntervalTimeRemaining <= 3 && currentIntervalTimeRemaining > 0) {
                    playSound('threeSecond');
                    updateBackgroundAndCircleColor(timerIntervalsData[currentIntervalIndex].type, true);
                } else {
                    updateBackgroundAndCircleColor(timerIntervalsData[currentIntervalIndex].type);
                }

                updateCircleContent();
                updateSecondaryDisplays();

                if (currentIntervalTimeRemaining <= 0) {
                    currentIntervalIndex++;
                    if (currentIntervalIndex >= timerIntervalsData.length) {
                        currentRepeat++;
                        if (currentRepeat <= maxRepeats) {
                            currentIntervalIndex = 0;
                        } else {
                            playSound('lastRound');
                            clearInterval(timerIntervalId);
                            isTimerRunning = false;
                            isTimerPaused = false;
                            resetTimer();
                            updateBackgroundAndCircleColor('initial');
                            console.log('Timer beendet!');
                            completionDialog.classList.add('active');
                            return;
                        }
                    }

                    currentIntervalTimeRemaining = timerIntervalsData[currentIntervalIndex].duration;
                    halfwayPoint = Math.floor(currentIntervalTimeRemaining / 2);

                    const type = timerIntervalsData[currentIntervalIndex].type;
                    console.log(`Wechsel zu Intervalltyp: ${type}, Index: ${currentIntervalIndex}`);
                    playSound(type === 'interval' ? 'intervalStart' : 'restStart');

                    updateBackgroundAndCircleColor(timerIntervalsData[currentIntervalIndex].type);
                    highlightCurrentInterval();
                }

                if (totalTimeRemaining <= 0) {
                    playSound('lastRound');
                    clearInterval(timerIntervalId);
                    isTimerRunning = false;
                    isTimerPaused = false;
                    resetTimer();
                    updateBackgroundAndCircleColor('initial');
                    console.log('Gesamtzeit abgelaufen!');
                    completionDialog.classList.add('active');
                }
            }, 1000);
        }

        function pauseTimer() {
            isTimerPaused = true;
            clearInterval(timerIntervalId);
            updateCircleContent();
        }

        function resetTimer() {
            clearInterval(timerIntervalId);
            isTimerRunning = false;
            isTimerPaused = false;
            currentIntervalIndex = 0;
            currentRepeat = 1;
            totalTimeRemaining = 0;
            currentIntervalTimeRemaining = 0;
            halfwayPoint = 0;
            intervalItems = [];
            soundQueue = [];
            audioPlayers = {};
            audioBuffers = {};
            isAudioInitialized = false;

            resetTimerDisplay();
            updateBackgroundAndCircleColor('initial');
            intervalItems.forEach(item => item.classList.remove('active'));
        }

        function resetTimerDisplay() {
            circleText.textContent = 'START';
            circleText.classList.remove('hidden');
            circleCountdown.classList.add('hidden');
            circleTotalCountdown.classList.add('hidden');
            currentIntervalNumberDisplay.textContent = '00';
            totalCountdownBelowCircle.textContent = 'Gesamt: 00:00';
        }

        // --- Event Listener ---

        mainCircle.addEventListener('click', () => {
            if (isTimerRunning && !isTimerPaused) {
                pauseTimer();
            } else {
                startTimer();
            }
        });

        endButton.addEventListener('click', () => {
            endConfirmationDialog.classList.add('active');
            pauseTimer();
        });

        cancelEndButton.addEventListener('click', () => {
            endConfirmationDialog.classList.remove('active');
        });

        confirmEndButton.addEventListener('click', () => {
            endConfirmationDialog.classList.remove('active');
            resetTimer();
            window.location.href = '../home-screen/index.html';
        });

        restartTimerButton.addEventListener('click', () => {
            completionDialog.classList.remove('active');
            // Timer ist bereits durch resetTimer zurückgesetzt, kein weiterer Aufruf nötig
        });

        endTimerButton.addEventListener('click', () => {
            completionDialog.classList.remove('active');
            resetTimer();
            window.location.href = '../home-screen/index.html';
        });

        // --- Initialisierung ---

        document.addEventListener('DOMContentLoaded', () => {
            // Debugging: Prüfe dataStorage.js
            if (typeof loadVolumeBoost === 'undefined' || typeof loadSignals === 'undefined') {
                console.error('dataStorage.js nicht geladen oder Funktionen fehlen');
            } else {
                console.log('dataStorage.js erfolgreich geladen');
            }

            const urlParams = new URLSearchParams(window.location.search);
            const timerId = urlParams.get('timerId');

            if (!timerId) {
                console.error('Keine timerId in der URL gefunden');
                alert('Timer-ID fehlt. Bitte erneut versuchen.');
                window.location.href = '../home-screen/index.html';
                return;
            }

            const timers = loadTimers();
            const timer = timers.find(t => t.id === timerId);
            if (!timer) {
                console.error('Timer nicht gefunden:', timerId);
                alert('Timer nicht gefunden. Bitte versuchen Sie erneut.');
                window.location.href = '../home-screen/index.html';
                return;
            }

            // Setze den aktuellen Timer für die Sound-Auswahl
            currentTimer = timer;

            timerTitle.textContent = timer.name || 'Mein Timer';
            maxRepeats = timer.repeat || 1;

            timerIntervalsData = [];
            timer.intervals.forEach(interval => {
                if (interval.durationInterval > 0) {
                    timerIntervalsData.push({
                        type: 'interval',
                        name: interval.name,
                        duration: interval.durationInterval
                    });
                }
                if (interval.durationRest > 0) {
                    timerIntervalsData.push({
                        type: 'rest',
                        name: 'Rest',
                        duration: interval.durationRest
                    });
                }
            });

            const listContainer = document.getElementById('interval-list-container');
            listContainer.innerHTML = '';
            timerIntervalsData.forEach((item, index) => {
                const div = document.createElement('div');
                div.classList.add('interval-item');
                div.setAttribute('data-type', item.type);
                div.setAttribute('data-duration', item.duration);
                if (item.name) div.setAttribute('data-name', item.name);

                const itemName = item.type === 'rest' ? 'Rest' : (item.name || `Intervall ${Math.floor(index / 2) + 1}`);

                div.innerHTML = `
                    <span class="interval-item-name">${itemName}</span>
                    <span class="interval-item-time">${formatTime(item.duration)}</span>
                `;
                listContainer.appendChild(div);
            });

            intervalItems = Array.from(document.querySelectorAll('.interval-item'));

            updateBackgroundAndCircleColor('initial');
            resetTimerDisplay();

            // Vorab-Laden der Audiodateien
            initAudio();
            
            lucide.createIcons();
        });

        // Service Worker Registrierung
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('../sw.js').then(() => {
                console.log('Service Worker registriert');
            }).catch(error => console.error('Service Worker Fehler:', error));
        }
    </script>
