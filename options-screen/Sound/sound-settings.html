<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#09090b" />
    <title>Sound Settings</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <script src="../../js/dataStorage.js"></script>
    <script src="../../js/ui-config.js"></script>
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #09090b;
            font-family: 'Inter', sans-serif;
            color: #fafafa;
            overscroll-behavior: none;
            scroll-padding-top: 4rem;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 50;
            padding: 1rem;
            background-color: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #27272a;
        }
        
        header::before {
            content: "";
            position: absolute;
            top: -100vh;
            left: 0;
            right: 0;
            height: 100vh;
            background-color: #09090b;
            z-index: -1;
        }

        .volume-dial-container {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 4px solid #27272a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-top: 4rem;
            background-color: #18181b;
            cursor: grab;
            user-select: none;
            touch-action: none;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }

        .volume-dial-container:active {
            transform: scale(0.98);
        }

        .volume-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            transition: height 0.05s ease-out, background-color 0.1s ease-out;
            transform-origin: bottom;
            opacity: 0.8;
        }
        
        .volume-value {
            position: relative;
            z-index: 10;
            font-size: 5rem;
            font-weight: 700;
            color: #fafafa;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-variant-numeric: tabular-nums;
        }

        .instruction {
            margin-top: 2rem;
            color: #a1a1aa;
            font-size: 0.9rem;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>

<body class="text-textMain">
    <header id="header" class="text-textMain">
        <div class="w-full flex justify-between items-center">
            <button onclick="triggerHapticFeedback(10); window.location.href='../options-screen.html'" class="p-2 -ml-2 rounded-full active:bg-surfaceBorder transition-colors">
                <i data-lucide="chevron-left" class="w-6 h-6 text-primary"></i>
            </button>
            <h1 class="text-xl font-semibold tracking-wide">Sound</h1>
            <div class="w-10"></div> <!-- placeholder -->
        </div>
    </header>

    <div class="volume-dial-container" id="volumeDial">
        <div class="volume-fill" id="volumeFill"></div>
        <span class="volume-value" id="volumeValue">100</span>
    </div>

    <p class="instruction">
        Streiche nach oben oder unten, um die Lautstärke anzupassen.
    </p>

    <script>
        const volumeDial = document.getElementById('volumeDial');
        const volumeFill = document.getElementById('volumeFill');
        const volumeValueDisplay = document.getElementById('volumeValue');

        let isDragging = false;
        let currentVolume = 100;
        let initialMouseY;
        let initialVolume;
        let lastHapticVolume = 100;

        const colors = {
            low: { r: 34, g: 197, b: 94 },    // Soft Jade
            mid: { r: 249, g: 115, b: 22 },   // Light Vermillion
            high: { r: 235, g: 70, b: 57 }    // Light Crimson
        };

        function interpolateColor(color1, color2, factor) {
            let result = {};
            result.r = Math.round(color1.r + factor * (color2.r - color1.r));
            result.g = Math.round(color1.g + factor * (color2.g - color1.g));
            result.b = Math.round(color1.b + factor * (color2.b - color1.b));
            return `rgb(${result.r}, ${result.g}, ${result.b})`;
        }

        window.audioContext = window.audioContext || new (window.AudioContext || window.webkitAudioContext)();
        window.mainGainNode = window.audioContext.createGain();

        // Limiter-Konfiguration:
        // Lässt Pegel bis 1.5 (Gain) unbeeinflusst durch.
        // Bei Werten darüber greift die Kompression, um extremes Clipping zu verhindern.
        // Zur Not kann LIMITER_CEILING auf 1.0 gesetzt werden, falls absolute Verzerrungsfreiheit gewünscht ist.
        const LIMITER_CEILING = 1.5;

        const preLimiterGain = window.audioContext.createGain();
        preLimiterGain.gain.value = 1 / LIMITER_CEILING;

        const compressor = window.audioContext.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(0, window.audioContext.currentTime); // 0 dB
        compressor.knee.setValueAtTime(6, window.audioContext.currentTime);
        compressor.ratio.setValueAtTime(20, window.audioContext.currentTime);
        compressor.attack.setValueAtTime(0.002, window.audioContext.currentTime);
        compressor.release.setValueAtTime(0.1, window.audioContext.currentTime);

        const postLimiterGain = window.audioContext.createGain();
        postLimiterGain.gain.value = LIMITER_CEILING;

        window.mainGainNode.connect(preLimiterGain);
        preLimiterGain.connect(compressor);
        compressor.connect(postLimiterGain);
        postLimiterGain.connect(window.audioContext.destination);

        // Preview-Sound Puffer (Horn)
        let previewBuffer = null;

        function getHornUrl() {
            if (window.location.pathname.includes('Timer-App')) {
                return window.location.origin + '/Timer-App/assets/sounds/horn.mp3';
            }
            return '../../assets/sounds/horn.mp3';
        }

        async function loadPreviewSound() {
            try {
                const response = await fetch(getHornUrl());
                const arrayBuffer = await response.arrayBuffer();
                previewBuffer = await window.audioContext.decodeAudioData(arrayBuffer);
                console.log('Preview Sound (Horn) erfolgreich geladen');
            } catch (e) {
                console.warn('decodeAudioData fehlgeschlagen, nutze Fallback:', e);
            }
        }

        async function playPreviewSound() {
            try {
                if (window.audioContext.state === 'suspended') {
                    await window.audioContext.resume();
                }

                if (!previewBuffer) {
                    await loadPreviewSound();
                }

                if (previewBuffer) {
                    const source = window.audioContext.createBufferSource();
                    source.buffer = previewBuffer;
                    source.connect(window.mainGainNode);
                    source.start(0);
                    console.log('Horn-Preview abgespielt via Web Audio');
                    return;
                }
            } catch (err) {
                console.error('Fehler bei Web Audio Preview:', err);
            }

            // Fallback: Normales HTML5 Audio
            try {
                const audio = new Audio(getHornUrl());
                audio.volume = Math.min(1.0, (Number(currentVolume) || 100) / 100);
                audio.play();
                console.log('Horn-Preview abgespielt via Audio Fallback');
            } catch (err) {
                console.error('Audio Fallback fehlgeschlagen:', err);
            }
        }

        // Einheitliche Formel: 50% = 0.5, 100% = 1.0, 200% = 2.0, 300% = 3.0
        function mapVolumeToGain(volume) {
            return Math.max(0, volume / 100);
        }

        function updateVolumeDisplay() {
            const displayVol = Math.round(currentVolume);
            volumeValueDisplay.textContent = displayVol;
            const fillPercentage = ((currentVolume - 50) / 250) * 100;
            volumeFill.style.height = `${Math.max(0, Math.min(100, fillPercentage))}%`;

            let displayColor;
            if (currentVolume <= 100) {
                const factor = (currentVolume - 50) / (100 - 50);
                displayColor = interpolateColor(colors.low, colors.mid, factor);
            } else {
                const factor = (currentVolume - 100) / (300 - 100);
                displayColor = interpolateColor(colors.mid, colors.high, factor);
            }
            volumeFill.style.backgroundColor = displayColor;
            window.mainGainNode.gain.value = mapVolumeToGain(currentVolume);

            // Haptic Feedback tick every 10% change
            if (Math.abs(displayVol - lastHapticVolume) >= 10) {
                triggerHapticFeedback(10);
                lastHapticVolume = displayVol;
            }
        }

        function saveAndUpdateVolume() {
            if (typeof saveVolumeBoost !== 'undefined') {
                saveVolumeBoost(currentVolume);
            }
            updateVolumeDisplay();
        }

        volumeDial.addEventListener('mousedown', (e) => {
            isDragging = true;
            initialMouseY = e.clientY;
            initialVolume = currentVolume;
            lastHapticVolume = Math.round(currentVolume);
            volumeDial.style.cursor = 'grabbing';
            triggerHapticFeedback([10, 30, 10]);
            if (window.audioContext.state === 'suspended') {
                window.audioContext.resume();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaY = initialMouseY - e.clientY;
            const sensitivity = 0.7;
            currentVolume = initialVolume + deltaY * sensitivity;
            currentVolume = Math.max(50, Math.min(300, currentVolume));
            saveAndUpdateVolume();
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                volumeDial.style.cursor = 'grab';
                saveAndUpdateVolume();
                triggerHapticFeedback(10);
                playPreviewSound();
            }
        });

        volumeDial.addEventListener('touchstart', (e) => {
            isDragging = true;
            initialMouseY = e.touches[0].clientY;
            initialVolume = currentVolume;
            lastHapticVolume = Math.round(currentVolume);
            volumeDial.style.cursor = 'grabbing';
            e.preventDefault();
            triggerHapticFeedback([10, 30, 10]);
            if (window.audioContext.state === 'suspended') {
                window.audioContext.resume();
            }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaY = initialMouseY - e.touches[0].clientY;
            const sensitivity = 0.7;
            currentVolume = initialVolume + deltaY * sensitivity;
            currentVolume = Math.max(50, Math.min(300, currentVolume));
            saveAndUpdateVolume();
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', () => {
            if (isDragging) {
                isDragging = false;
                volumeDial.style.cursor = 'grab';
                saveAndUpdateVolume();
                triggerHapticFeedback(10);
                playPreviewSound();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadVolumeBoost !== 'undefined') {
                const savedVolume = loadVolumeBoost();
                currentVolume = Number(savedVolume) || 100;
            } else {
                currentVolume = 100;
            }
            lastHapticVolume = Math.round(currentVolume);
            updateVolumeDisplay();
            loadPreviewSound();
            if (window.audioContext.state === 'suspended') {
                window.audioContext.resume();
            }
        });
    </script>
</body>
</html>
