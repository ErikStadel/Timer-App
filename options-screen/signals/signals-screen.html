<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#09090b" />
    <title>Signals</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <script src="../../js/dataStorage.js"></script>
    <script src="../../js/ui-config.js"></script>
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #09090b;
            font-family: 'Inter', sans-serif;
            color: #fafafa;
            overscroll-behavior: none;
            scroll-padding-top: 4rem;
            scroll-behavior: smooth;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 1rem;
            background-color: rgba(9, 9, 11, 0.85); /* Zinc 950 */
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #27272a; /* Zinc 800 */
        }
        
        header::before {
            content: "";
            position: absolute;
            top: -100vh;
            left: 0;
            right: 0;
            height: 100vh;
            background-color: #09090b;
            z-index: -1;
        }

        .main-content {
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            overflow-y: auto;
        }

        .signal-item {
            background-color: #18181b; /* Zinc 900 */
            border: 1px solid #27272a;
            border-radius: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1rem;
            font-size: 1.125rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .signal-item:active {
            transform: scale(0.97);
            background-color: #27272a;
        }

        .signal-item .value-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #a1a1aa; /* Zinc 400 */
            font-size: 1rem;
        }

        .signal-item i.right-icon {
            color: #52525b; /* Zinc 500 */
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body class="text-textMain">
    <header id="header" class="text-textMain">
        <div class="w-full flex justify-between items-center">
            <button onclick="triggerHapticFeedback(10); window.location.href='../options-screen.html'" class="p-2 -ml-2 rounded-full active:bg-surfaceBorder transition-colors">
                <i data-lucide="chevron-left" class="w-6 h-6 text-primary"></i>
            </button>
            <h1 class="text-xl font-semibold tracking-wide">Signals</h1>
            <div class="w-10"></div> <!-- placeholder -->
        </div>
    </header>

    <div class="main-content">
        <div class="signal-item" onclick="triggerHapticFeedback(10); window.location.href='signal-select.html?signalType=intervalStart'">
            <span>Interval Start</span>
            <div class="value-group">
                <span id="interval-start-signal">Horn</span>
                <i data-lucide="chevron-right" class="right-icon"></i>
            </div>
        </div>
        <div class="signal-item" onclick="triggerHapticFeedback(10); window.location.href='signal-select.html?signalType=restStart'">
            <span>Rest Start</span>
            <div class="value-group">
                <span id="rest-start-signal">Bell</span>
                <i data-lucide="chevron-right" class="right-icon"></i>
            </div>
        </div>
        <div class="signal-item" onclick="triggerHapticFeedback(10); window.location.href='signal-select.html?signalType=halfway'">
            <span>Halfway Signal</span>
            <div class="value-group">
                <span id="halfway-signal">Gong</span>
                <i data-lucide="chevron-right" class="right-icon"></i>
            </div>
        </div>
        <div class="signal-item" onclick="triggerHapticFeedback(10); window.location.href='signal-select.html?signalType=threeSecond'">
            <span>3 Second Signal</span>
            <div class="value-group">
                <span id="three-second-signal">Beep</span>
                <i data-lucide="chevron-right" class="right-icon"></i>
            </div>
        </div>
        <div class="signal-item" onclick="triggerHapticFeedback(10); window.location.href='signal-select.html?signalType=lastRound'">
            <span>Last Round</span>
            <div class="value-group">
                <span id="last-round-signal">Applause</span>
                <i data-lucide="chevron-right" class="right-icon"></i>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const signals = loadSignals();
            const globalSignals = loadGlobalSignals();

            const signalElements = {
                'intervalStart': document.getElementById('interval-start-signal'),
                'restStart': document.getElementById('rest-start-signal'),
                'halfway': document.getElementById('halfway-signal'),
                'threeSecond': document.getElementById('three-second-signal'),
                'lastRound': document.getElementById('last-round-signal')
            };

            Object.keys(signalElements).forEach(type => {
                const signalId = globalSignals[type];
                const signal = signals.find(s => s.id === signalId);
                signalElements[type].textContent = signal ? signal.name : 'None';
            });
        });
    </script>
</body>
</html>
