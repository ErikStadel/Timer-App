<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#09090b" />
    <title>Data</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <script src="../../js/dataStorage.js"></script>
    <script src="../../js/ui-config.js"></script>
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #09090b;
            font-family: 'Inter', sans-serif;
            color: #fafafa;
            overscroll-behavior: none;
            scroll-padding-top: 4rem;
            scroll-behavior: smooth;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 1rem;
            background-color: rgba(9, 9, 11, 0.85); /* Zinc 950 */
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #27272a; /* Zinc 800 */
        }
        
        header::before {
            content: "";
            position: absolute;
            top: -100vh;
            left: 0;
            right: 0;
            height: 100vh;
            background-color: #09090b;
            z-index: -1;
        }

        .action-button {
            background-color: #18181b; /* Zinc 900 */
            border: 1px solid #27272a;
            border-radius: 1rem;
            padding: 1.25rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.125rem;
            font-weight: 500;
            color: #fafafa;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            width: 100%;
        }

        .action-button:active {
            transform: scale(0.97);
            background-color: #27272a;
        }

        .action-button i {
            color: #22c55e; /* Soft Jade */
        }

    </style>
</head>
<body class="text-textMain">
    <header id="header" class="text-textMain">
        <div class="w-full flex justify-between items-center">
            <button onclick="triggerHapticFeedback(10); window.location.href='../options-screen.html'" class="p-2 -ml-2 rounded-full active:bg-surfaceBorder transition-colors">
                <i data-lucide="chevron-left" class="w-6 h-6 text-primary"></i>
            </button>
            <h1 class="text-xl font-semibold tracking-wide">Data</h1>
            <div class="w-10"></div> <!-- placeholder to balance the Back button -->
        </div>
    </header>

    <div class="p-4 flex flex-col gap-4">
        <p class="text-center text-sm text-textMuted mb-4">
            Exportiere deine Timer, Signale und Einstellungen als Datei, um sie auf einem anderen Gerät oder einer anderen URL wiederherzustellen.
        </p>

        <button id="export-btn" class="action-button">
            <i data-lucide="download"></i>
            <span>Backup Exportieren</span>
        </button>

        <div class="relative w-full">
            <input type="file" id="import-file" class="hidden" accept=".json" />
            <label for="import-file" class="action-button mb-0">
                <i data-lucide="upload"></i>
                <span>Backup Importieren</span>
            </label>
        </div>
        
        <div id="status-message" class="text-center font-semibold mt-4 hidden"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const exportBtn = document.getElementById('export-btn');
            const importFile = document.getElementById('import-file');
            const statusMessage = document.getElementById('status-message');

            function showStatus(text, isError = false) {
                statusMessage.textContent = text;
                statusMessage.className = `text-center font-semibold mt-4 ${isError ? 'text-negative' : 'text-primary'}`;
                statusMessage.classList.remove('hidden');
                setTimeout(() => {
                    statusMessage.classList.add('hidden');
                }, 3000);
            }

            exportBtn.addEventListener('click', () => {
                triggerHapticFeedback(10);
                try {
                    const data = {
                        timers: localStorage.getItem(TIMER_STORAGE_KEY),
                        signals: localStorage.getItem(SIGNAL_STORAGE_KEY),
                        globalSignals: localStorage.getItem(GLOBAL_SIGNALS_KEY),
                        volumeBoost: localStorage.getItem(VOLUME_BOOST_KEY)
                    };

                    const dataStr = JSON.stringify(data);
                    const dataBlob = new Blob([dataStr], { type: 'application/json' });
                    const url = URL.createObjectURL(dataBlob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    const date = new Date().toISOString().split('T')[0];
                    a.download = `timerapp-backup-${date}.json`;
                    
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    showStatus('Backup erfolgreich exportiert!');
                    triggerHapticFeedback(30);
                } catch (e) {
                    console.error(e);
                    showStatus('Fehler beim Exportieren!', true);
                    triggerHapticFeedback([10, 50, 10]);
                }
            });

            importFile.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const content = e.target.result;
                        const data = JSON.parse(content);
                        
                        let imported = false;
                        if (data.timers) { localStorage.setItem(TIMER_STORAGE_KEY, data.timers); imported = true; }
                        if (data.signals) { localStorage.setItem(SIGNAL_STORAGE_KEY, data.signals); imported = true; }
                        if (data.globalSignals) { localStorage.setItem(GLOBAL_SIGNALS_KEY, data.globalSignals); imported = true; }
                        if (data.volumeBoost) { localStorage.setItem(VOLUME_BOOST_KEY, data.volumeBoost); imported = true; }
                        
                        if (imported) {
                            showStatus('Backup erfolgreich importiert!');
                            triggerHapticFeedback(30);
                        } else {
                            showStatus('Datei enthält keine passenden Daten.', true);
                            triggerHapticFeedback([10, 50, 10]);
                        }
                        
                        // Reset input
                        event.target.value = '';
                    } catch (err) {
                        console.error(err);
                        showStatus('Fehler beim Importieren der Datei!', true);
                        triggerHapticFeedback([10, 50, 10]);
                    }
                };
                reader.readAsText(file);
            });
        });
    </script>
</body>
</html>
