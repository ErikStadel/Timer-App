<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#09090b" />
    <title>Options Screen</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="../js/dataStorage.js"></script>
    <script src="../js/ui-config.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #09090b;
            font-family: 'Inter', sans-serif;
            color: #fafafa;
            overscroll-behavior: none;
            scroll-padding-top: 4rem;
            scroll-behavior: smooth;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 1rem;
            background-color: rgba(9, 9, 11, 0.85); /* Zinc 950 */
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #27272a; /* Zinc 800 */
        }
        
        header::before {
            content: "";
            position: absolute;
            top: -100vh;
            left: 0;
            right: 0;
            height: 100vh;
            background-color: #09090b;
            z-index: -1;
        }

        .main-content {
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            overflow-y: auto;
        }

        .option-button {
            background-color: #18181b; /* Zinc 900 */
            border: 1px solid #27272a;
            border-radius: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1rem;
            text-align: left;
            font-size: 1.125rem;
            font-weight: 500;
            color: #fafafa;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
        }

        .option-button:active {
            transform: scale(0.97);
            background-color: #27272a;
        }

        .option-button .icon-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .option-button i.left-icon {
            color: #22c55e; /* Soft Jade */
        }

        .option-button i.right-icon {
            color: #52525b; /* Zinc 500 */
        }
    </style>
</head>

<body>
    <header id="header" class="text-textMain">
      <div class="w-full flex justify-between items-center">
        <div class="w-10"></div> <!-- Placeholder -->
        <h1 class="text-xl font-semibold tracking-wide">Options</h1>
        <button onclick="triggerHapticFeedback(10); window.location.href='../home-screen/index.html'" class="text-primary font-semibold tracking-wide p-2 -mr-2 rounded-full active:bg-surfaceBorder transition-colors">
          Fertig
        </button>
      </div>
    </header>

    <div class="main-content">
        <a href="signals/signals-screen.html" class="option-button" onclick="triggerHapticFeedback(10)">
            <div class="icon-group">
                <i data-lucide="bell" class="left-icon"></i>
                <span>Signals</span>
            </div>
            <i data-lucide="chevron-right" class="right-icon"></i>
        </a>

        <a href="Sound/sound-settings.html" class="option-button" onclick="triggerHapticFeedback(10)">
            <div class="icon-group">
                <i data-lucide="volume-2" class="left-icon"></i>
                <span>Sound</span>
            </div>
            <i data-lucide="chevron-right" class="right-icon"></i>
        </a>

        <a href="data/data-screen.html" class="option-button" onclick="triggerHapticFeedback(10)">
            <div class="icon-group">
                <i data-lucide="database" class="left-icon"></i>
                <span>Data</span>
            </div>
            <i data-lucide="chevron-right" class="right-icon"></i>
        </a>
    </div>

</body>
</html>
